<!DOCTYPE html>
<html lang="es">
<head>
  <!-- ============================================================
       META & CONFIGURACIÓN BÁSICA
       ============================================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BackToMe – Panel de administración">
  <title>BackToMe – Panel de Administrador</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons 1.11 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts – Nunito -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============================================================
       NAVBAR
       Solo logo
       ============================================================ -->
  <nav class="btm-navbar navbar px-4 py-2">
    <!-- Logo -->
    <a href="index.html" class="btm-logo">
      <div class="btm-logo-img">
        <img src="imagenes/logo.png" alt="BackToMe" width="38" height="38">
      </div>
      <span class="btm-logo-text">
        <span class="bold-part">Back</span><span class="light-part">ToMe</span>
      </span>
    </a>
  </nav>

  <!-- ============================================================
       CONTENIDO PRINCIPAL
       ============================================================ -->
  <main class="container-fluid px-4 py-4">

    <!-- Encabezado -->
    <div class="mb-4">
      <h2 class="fw-bold">
        <i class="bi bi-shield-check text-primary me-2"></i>Panel de Administración
      </h2>
      <p class="text-muted mb-0">Estadísticas de la plataforma</p>
    </div>

    <!-- Tarjetas de estadísticas -->
    <div class="row g-3 mb-4">
      <!-- Total usuarios -->
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
          <div class="stat-info">
            <p class="stat-label">Total usuarios</p>
            <p class="stat-value">892</p>
          </div>
          <div class="stat-icon icon-users">
            <i class="bi bi-people-fill"></i>
          </div>
        </div>
      </div>

      <!-- Total publicaciones -->
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
          <div class="stat-info">
            <p class="stat-label">Total publicaciones</p>
            <p class="stat-value">1,247</p>
          </div>
          <div class="stat-icon icon-posts">
            <i class="bi bi-file-earmark-text-fill"></i>
          </div>
        </div>
      </div>

      <!-- Nuevos hoy -->
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
          <div class="stat-info">
            <p class="stat-label">Nuevos hoy</p>
            <p class="stat-value">47</p>
          </div>
          <div class="stat-icon icon-new">
            <i class="bi bi-shield-check"></i>
          </div>
        </div>
      </div>

      <!-- Reportes -->
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="stat-card">
          <div class="stat-info">
            <p class="stat-label">Reportes</p>
            <p class="stat-value">3</p>
          </div>
          <div class="stat-icon icon-reports">
            <i class="bi bi-exclamation-triangle-fill"></i>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
