<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro - BackToMe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="d-flex align-items-center justify-content-center vh-100">

<div class="card shadow p-4" style="width: 350px;">
    <h4 class="text-center mb-3">Registrarse</h4>

    <input type="text" id="name" class="form-control mb-3" placeholder="Nombre">
    <input type="email" id="email" class="form-control mb-3" placeholder="Correo">
    <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">

    <button class="btn btn-primary w-100" onclick="register()">Crear cuenta</button>

    <p class="text-center mt-3">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
</div>

<script>
function register() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (!name || !email || !password) {
        alert("Completa todos los campos");
        return;
    }

    let user = {
        name: name,
        email: email,
        password: password
    };

    localStorage.setItem(email, JSON.stringify(user));

    alert("Usuario registrado correctamente");
    window.location.href = "login.html";
}
</script>

</body>
</html>
