<!DOCTYPE html>
<html lang="es">

  <head>
    <!-- ============================================================
       META & CONFIGURACIÓN BÁSICA
       ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="BackToMe – Plataforma para recuperar objetos perdidos">
    <title>BackToMe – Iniciar Sesión</title>

    <!-- ============================================================
       DEPENDENCIAS EXTERNAS
       Orden recomendado: CSS frameworks → Icon fonts → Tipografías
       ============================================================ -->

    <!-- Bootstrap 5.3 – Grid, utilidades y componentes base -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <!-- Bootstrap Icons 1.11 – Iconografía del formulario -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet">

    <!-- Google Fonts – Nunito (pesos necesarios solamente) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

    <!-- Estilos personalizados del login -->
    <link rel="stylesheet" href="styles_login.css">
  </head>

  <body class="login-body">

    <!-- ============================================================
       FONDO ANIMADO
       Capa decorativa con gradientes radiales en movimiento.
       z-index negativo para que quede detrás del contenido.
       ============================================================ -->
    <div class="bg-animation" aria-hidden="true"></div>

    <!-- ============================================================
       CONTENEDOR PRINCIPAL DEL LOGIN
       ============================================================ -->
    <main class="login-container" role="main">

      <!-- ----------------------------------------------------------
         ENCABEZADO: Logo + Títulos
         ---------------------------------------------------------- -->
      <header class="login-header text-center mb-5">
        <div class="logo mb-4">
          <img
            src="imagenes/logo.png"
            alt="Logo de BackToMe"
            class="logo-img"
            width="80"
            height="80">
        </div>
        <h1 class="login-title">Bienvenido a BackToMe</h1>
        <p class="login-subtitle">Inicia sesión para recuperar tus objetos</p>
      </header>

      <!-- ----------------------------------------------------------
         FORMULARIO DE LOGIN
         id="loginForm" → capturado en login.js para el submit
         ---------------------------------------------------------- -->
      <form id="loginForm" class="login-form" novalidate>

        <!-- Campo: Correo electrónico -->
        <div class="form-floating mb-4">
          <input
            type="email"
            class="form-control login-input"
            id="email"
            name="email"
            placeholder="nombre@ejemplo.com"
            autocomplete="email"
            required>
          <label for="email">
            <i class="bi bi-envelope me-2" aria-hidden="true"></i>Correo
            electrónico
          </label>
        </div>

        <!-- Campo: Contraseña (con botón para mostrar/ocultar) -->
        <div class="form-floating mb-4 position-relative">
          <input
            type="password"
            class="form-control login-input"
            id="password"
            name="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required>
          <label for="password">
            <i class="bi bi-lock me-2" aria-hidden="true"></i>Contraseña
          </label>

          <!-- Toggle visibilidad: alterna type="password" ↔ type="text" -->
          <button
            type="button"
            class="btn-toggle-pass"
            id="togglePassword"
            aria-label="Mostrar u ocultar contraseña">
            <i class="bi bi-eye" id="passIcon" aria-hidden="true"></i>
          </button>
        </div>

        <!-- Fila: Recordarme + ¿Olvidaste tu contraseña? -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe"
              name="rememberMe">
            <label class="form-check-label small"
              for="rememberMe">Recordarme</label>
          </div>
          <!-- TODO: conectar con flujo de reset de contraseña en Supabase -->
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón de envío con estado de carga -->
        <button type="submit" class="btn btn-primary btn-login w-100 mb-4">
          <span class="btn-text">Iniciar Sesión</span>
          <!-- Spinner visible solo durante la petición (controlado desde JS) -->
          <span class="btn-loader d-none" aria-live="polite">
            <span class="spinner-border spinner-border-sm" role="status"
              aria-hidden="true"></span>
            <span class="visually-hidden">Cargando...</span>
          </span>
        </button>
      </form>

      <!-- ----------------------------------------------------------
         PIE: Enlace al registro
         ---------------------------------------------------------- -->
      <footer class="text-center">
        <p class="login-footer mb-0">
          ¿No tienes cuenta?
          <a href="registro.html" class="register-link">Crea una gratis</a>
        </p>
      </footer>

      <!-- ----------------------------------------------------------
         MENSAJE DE ERROR
         Oculto por defecto (clase "d-none").
         login.js lo muestra/oculta según resultado del login.
         ---------------------------------------------------------- -->
      <div
        id="errorMessage"
        class="alert alert-danger alert-dismissible fade show d-none mt-3"
        role="alert"
        aria-live="assertive">
        <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
        <span id="errorText">Correo o contraseña incorrectos</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"
          aria-label="Cerrar"></button>
      </div>

    </main><!-- /login-container -->

    <!-- ============================================================
       SCRIPTS
       Bootstrap Bundle incluye Popper (necesario para alerts)
       Supabase (librería cliente) antes de login.js
       login.js al final para que el DOM ya esté disponible
       ============================================================ -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
  </body>
</html>
