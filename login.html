<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - BackToMe</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body class="d-flex align-items-center justify-content-center vh-100">

<div class="card shadow p-4" style="width: 350px;">
    <h4 class="text-center mb-3">Iniciar Sesión</h4>

    <input type="email" id="email" class="form-control mb-3" placeholder="Correo">
    <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">

    <button class="btn btn-primary w-100" onclick="login()">Entrar</button>

    <p class="text-center mt-3">
        ¿No tienes cuenta? <a href="register.html">Regístrate</a>
    </p>
</div>

<script>
function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let user = JSON.parse(localStorage.getItem(email));

    if (user && user.password === password) {
        alert("Login exitoso");
        window.location.href = "index.html"; // redirige al inicio
    } else {
        alert("Correo o contraseña incorrectos");
    }
}
</script>

</body>
</html>
